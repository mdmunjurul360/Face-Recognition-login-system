<!DOCTYPE html>
<html>
<head>
  <title>Face Login</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin-top: 50px;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    video, canvas {
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      margin: 10px 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    #startBtn {
      background: #22c55e;
      color: white;
    }

    #captureBtn {
      background: #3b82f6;
      color: white;
    }

    input {
      padding: 8px;
      border-radius: 5px;
      border: none;
      width: 90%;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🔐 Face Login System</h2>

    <!-- ✅ NEW: name input -->
    <input type="text" id="name" placeholder="Enter your name" />

    <video id="video" width="300" autoplay></video>

    <br>

    <button id="startBtn">Start Camera</button>
    <button id="captureBtn">Capture</button>

    <p id="result"></p>

    <br>

    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <script src="script.js"></script>

</body>
</html>
